version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: eda-rabbitmq
    ports:
      - "5672:5672"    # AMQP broker port
      - "15672:15672"  # RabbitMQ Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped
